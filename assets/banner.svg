<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(.98)}50%{opacity:.7;transform:scale(1.02)}}@keyframes floatParticle{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-15px) rotate(180deg)}}@keyframes scanLine{0%{transform:translateY(0);opacity:0}50%{opacity:.8}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:46px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#cbd5e1}.badge-text{font-weight:600;font-size:14px;fill:#a5b4fc}.pulse{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.particle-1,.particle-2{animation:floatParticle 8s ease-in-out infinite;transform-origin:center}.particle-2{animation:floatParticle 12s ease-in-out infinite reverse}.scan{animation:scanLine 4s linear infinite}</style><rect width="1200" height="300" fill="url(#bgGrad)" rx="16"/><g opacity=".05"><path stroke="#fff" stroke-width="1" d="M 0 50 L 1200 50 M 0 100 L 1200 100 M 0 150 L 1200 150 M 0 200 L 1200 200 M 0 250 L 1200 250"/><path stroke="#fff" stroke-width="1" d="M 100 0 L 100 300 M 200 0 L 200 300 M 300 0 L 300 300 M 400 0 L 400 300 M 500 0 L 500 300 M 600 0 L 600 300 M 700 0 L 700 300 M 800 0 L 800 300 M 900 0 L 900 300 M 1000 0 L 1000 300 M 1100 0 L 1100 300"/></g><circle cx="150" cy="80" r="180" fill="#6366f1" class="pulse" filter="url(#glow)" opacity=".15"/><circle cx="1050" cy="220" r="200" fill="#ec4899" class="pulse" filter="url(#glow)" opacity=".15"/><polygon fill="#a855f7" points="950 50 1000 120 900 110" class="particle-1" opacity=".2"/><rect width="40" height="40" x="100" y="200" fill="#38bdf8" class="particle-2" opacity=".15" rx="8"/><line x1="0" x2="1200" y1="10" y2="10" stroke="url(#accentGrad)" stroke-width="2" class="scan"/><rect width="1100" height="220" x="50" y="40" fill="url(#cardGrad)" stroke="#fff" stroke-opacity=".15" stroke-width="1" rx="12"/><rect width="310" height="30" x="80" y="68" fill="#6366f1" fill-opacity=".2" stroke="#818cf8" stroke-opacity=".4" rx="15"/><text x="95" y="88" class="badge-text">🔍 DSPM &amp; DATA CLASSIFICATION</text><text x="80" y="145" class="title">Awesome Data Discovery &amp; Classification</text><rect width="480" height="4" x="80" y="162" fill="url(#accentGrad)" rx="2"/><text x="80" y="205" class="subtitle">Curated ecosystem of SaaS platforms &amp; open-source tools for sensitive data governance &amp; PII/PHI detection.</text></svg>