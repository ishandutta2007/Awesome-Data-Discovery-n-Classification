<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #a5b4fc; }

    /* Animated background elements */
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }

    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(180deg); }
      100% { transform: translateY(0px) rotate(360deg); }
    }

    @keyframes scanLine {
      0% { transform: translateY(0px); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(280px); opacity: 0; }
    }

    .pulse { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .particle-1 { animation: floatParticle 8s ease-in-out infinite; transform-origin: center; }
    .particle-2 { animation: floatParticle 12s ease-in-out infinite reverse; transform-origin: center; }
    .scan { animation: scanLine 4s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="16" />

  <!-- Grid overlay -->
  <g opacity="0.05">
    <path d="M 0 50 L 1200 50 M 0 100 L 1200 100 M 0 150 L 1200 150 M 0 200 L 1200 200 M 0 250 L 1200 250" stroke="#ffffff" stroke-width="1"/>
    <path d="M 100 0 L 100 300 M 200 0 L 200 300 M 300 0 L 300 300 M 400 0 L 400 300 M 500 0 L 500 300 M 600 0 L 600 300 M 700 0 L 700 300 M 800 0 L 800 300 M 900 0 L 900 300 M 1000 0 L 1000 300 M 1100 0 L 1100 300" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Dynamic Animated background shapes (kept behind text) -->
  <circle cx="150" cy="80" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)" class="pulse" />
  <circle cx="1050" cy="220" r="200" fill="#ec4899" opacity="0.15" filter="url(#glow)" class="pulse" />
  <polygon points="950,50 1000,120 900,110" fill="#a855f7" opacity="0.2" class="particle-1" />
  <rect x="100" y="200" width="40" height="40" rx="8" fill="#38bdf8" opacity="0.15" class="particle-2" />

  <!-- Scanning line animation element in background -->
  <line x1="0" y1="10" x2="1200" y2="10" stroke="url(#accentGrad)" stroke-width="2" class="scan" />

  <!-- Foreground Content Container Card -->
  <rect x="50" y="40" width="1100" height="220" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />

  <!-- Category Pill -->
  <rect x="80" y="68" width="310" height="30" rx="15" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-opacity="0.4" />
  <text x="95" y="88" class="badge-text">🔍 DSPM &amp; DATA CLASSIFICATION</text>

  <!-- Title & Subtitle in crisp foreground -->
  <text x="80" y="145" class="title">Awesome Data Discovery &amp; Classification</text>

  <!-- Gradient accent bar under title -->
  <rect x="80" y="162" width="480" height="4" rx="2" fill="url(#accentGrad)" />

  <text x="80" y="205" class="subtitle">Curated ecosystem of SaaS platforms &amp; open-source tools for sensitive data governance &amp; PII/PHI detection.</text>
</svg>
